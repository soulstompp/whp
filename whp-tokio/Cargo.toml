[package]
name = "whp-tokio"
description = "The whp command: PHP 8 templates run as requests on the tokio stack, from the command line (whp run)."
keywords = ["php", "template", "interpreter", "tokio", "web"]
categories = ["template-engine", "command-line-utilities"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme.workspace = true

[[bin]]
name = "whp"
path = "src/main.rs"
doc = false

[features]
round = []
poison = ["whp/poison"]

[dependencies]
whp = { path = "../whp", version = "0.0.1" }
tokio = { version = "1", features = ["rt-multi-thread", "time"] }
